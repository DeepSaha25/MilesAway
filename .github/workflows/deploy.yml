name: Deploy

on:
  workflow_dispatch:
    inputs:
      app_environment:
        description: Expo EAS profile to build
        required: true
        default: preview-apk
        type: choice
        options:
          - preview-apk
          - production
      deploy_backend:
        description: Deploy backend to Railway
        required: true
        default: false
        type: boolean
      deploy_app:
        description: Build app with EAS
        required: true
        default: false
        type: boolean

jobs:
  backend:
    name: Deploy backend
    if: inputs.deploy_backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_NAME }}"

  app:
    name: Build app
    if: inputs.deploy_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RunSphere
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RunSphere/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        run: eas build --platform android --profile "${{ inputs.app_environment }}" --non-interactive
